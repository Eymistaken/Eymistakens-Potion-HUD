plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Eymistaken's HUD publishes through JitPack, exactly as its API guide documents.
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.terraformersmc.com/releases/' }
    maven { url 'https://maven.shedaniel.me/' }
    // Optional escape hatch: drop the HUD jar into libs/ if JitPack is unreachable.
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // All three are compileOnly on purpose: every one of them is optional at runtime, and
    // the code that touches them is behind a FabricLoader.isModLoaded check. Keeping
    // them off the runtime classpath lets the standalone path start without the HUD.
    //
    // The HUD: present, this mod is one of its modules; absent, it draws itself.
    compileOnly "com.github.Eymistaken:Eymistaken-s-hud:${project.eymistakens_hud_version}"
    // Cloth Config: the standalone settings screen. Mod Menu: the button that opens it.
    compileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
