name: Build

# Builds every push and every pull request. Publishes a release only when the version in
# gradle.properties names something that has not been tagged yet, so a normal code push
# builds and stops, and a version bump builds and ships.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.value }}
      released: ${{ steps.tag.outputs.exists }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Tags are how the release step knows what has already shipped, and a shallow
          # clone does not carry them.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Read the mod version
        id: version
        run: |
          version=$(sed -n 's/^[[:space:]]*mod_version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "No mod_version in gradle.properties." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Check whether this version is already tagged
        id: tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.value }} is already tagged; this run will not publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Committed from Windows, the wrapper can arrive without its execute bit.
      - run: chmod +x ./gradlew

      - run: ./gradlew build --no-daemon --stacktrace

      # The sources and dev jars are build products, not something to hand a player.
      - name: Collect the mod jar
        run: |
          mkdir -p artifacts
          find build/libs -maxdepth 1 -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-dev-shadow.jar' \
            -exec cp {} artifacts/ \;
          ls -l artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: eymistakens-potion-hud-${{ steps.version.outputs.value }}
          path: artifacts/*.jar
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only from the branch, only when the version is one nothing has shipped under yet.
    if: github.event_name == 'push' && needs.build.outputs.released == 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: eymistakens-potion-hud-${{ needs.build.outputs.version }}
          path: artifacts

      # Release notes come from CHANGELOG.md, so write that file for the version you are
      # about to publish, then bump mod_version in the same commit.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          notes=(--generate-notes)
          if [ -s CHANGELOG.md ]; then
            notes=(--notes-file CHANGELOG.md)
          fi
          # --target pins the new tag to the commit that was actually built. Without it
          # gh creates the tag at whatever the default branch points to now, so a push
          # landing mid-run would tag code this jar was not built from.
          gh release create "v$VERSION" artifacts/*.jar \
            --target "$GITHUB_SHA" \
            --title "Eymistaken's Potion HUD v$VERSION" \
            "${notes[@]}"
