org.gradle.jvmargs=-Xmx3G

# Mod
mod_version = 1.0.2
maven_group = com.eymistaken.potionhud
archives_base_name = eymistakens-potion-hud

# Toolchain — kept in lockstep with Eymistaken's HUD (simplecps) so both mods
# load in the same dev runtime without a loader/API mismatch.
minecraft_version=26.2
loader_version=0.19.3
fabric_version=0.152.1+26.2
java_version=25

# Optional integrations, all compileOnly. Eymistaken's HUD comes from JitPack and matches
# its latest release tag; Cloth and Mod Menu back the standalone settings screen.
eymistakens_hud_version=1.1.1-9
cloth_config_version=26.2.155
modmenu_version=20.0.1
